openapi: 3.0.3
info:
  title: Logistics Hub Tracking API
  version: 1.0.0
servers:
  - url: https://logistics.example.invalid
    description: Production placeholder
paths:
  /api/v1/shipments/{trackingNumber}/events:
    get:
      operationId: getTrackingEvents
      summary: Read shipment event history
      security:
        - bearerAuth: []
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^LH-[0-9]{4}-[0-9]{6}$'
          example: LH-2026-000003
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Shipment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPage'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Production uses IdP JWT; the local prototype uses an environment supplied demo token.
  schemas:
    TrackingEvent:
      type: object
      required: [source, eventId, trackingNumber, status, warehouseId, occurredAt, weightKg]
      properties:
        source: {type: string, example: carrier-a}
        eventId: {type: string, example: evt-0003}
        trackingNumber: {type: string, pattern: '^LH-[0-9]{4}-[0-9]{6}$'}
        status: {type: string, enum: [received, inTransit, delivered]}
        warehouseId: {type: string, pattern: '^W[0-9]{2}$'}
        occurredAt: {type: string, format: date-time}
        weightKg: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 10000, multipleOf: 0.001}
    TrackingPage:
      type: object
      required: [trackingNumber, events, limit]
      properties:
        trackingNumber: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100}
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TrackingEvent'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
